<svg xmlns="http://www.w3.org/2000/svg" width="420" height="128" viewBox="0 0 420 128">
<style>
text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
.org{font-size:12px;fill:#737aa2} .name{font-size:20px;font-weight:700;fill:#c0caf5}
.blurb{font-size:13px;fill:#a9b1d6} .meta{font-size:12px;fill:#737aa2}
.chip{font-size:12px;font-weight:600;text-anchor:middle}
.card{animation:rise .6s ease-out both} @keyframes rise{from{opacity:0;transform:translateY(6px)}}
</style>
<g class="card">
<rect x="0.5" y="0.5" width="419" height="127" rx="12" fill="#1a1b27" stroke="none"/>
<rect x="0.5" y="16" width="4" height="96" rx="2" fill="#bb9af7"/>
<text x="24" y="30" class="org">vllm-project</text>
<text x="24" y="54" class="name">semantic-router</text>
<text x="396" y="30" class="meta" text-anchor="end">★ 5.9k</text>
<text x="24" y="74" class="blurb">Mixture-of-Models router for LLM inference</text>
<rect x="24" y="86" width="114" height="22" rx="11" fill="#bb9af7" fill-opacity="0.16"/><text x="81" y="101" class="chip" fill="#bb9af7">CPU inference</text><rect x="145.60000000000002" y="86" width="142" height="22" rx="11" fill="#bb9af7" fill-opacity="0.16"/><text x="217" y="101" class="chip" fill="#bb9af7">Integration tests</text>
</g>
</svg>
