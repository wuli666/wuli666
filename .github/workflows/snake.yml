name: profile

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#7aa2f7&color_dots=#ebedf0,#c5cff5,#9aabf0,#7aa2f7,#bb9af7
            dist/snake-dark.svg?palette=github-dark&color_snake=#7aa2f7&color_dots=#1a1b27,#2e3c64,#3d59a1,#7aa2f7,#bb9af7
      # snk has no option to hide the progress bar under the grid: crop the
      # bottom 2 of its 12 rows (2 top margin + 7 grid + 3 bar).
      - name: Crop progress bar
        run: |
          python3 - <<'PY'
          import re, glob
          for p in glob.glob("dist/*.svg"):
              s = open(p).read()
              def vb(m):
                  a = m.group(1).split(); a[3] = str(float(a[3]) * 10 / 12)
                  return 'viewBox="' + " ".join(a) + '"'
              s = re.sub(r'viewBox="([^"]+)"', vb, s, count=1)
              s = re.sub(r'(<svg[^>]*?\sheight=")([\d.]+)', lambda m: m.group(1) + str(float(m.group(2)) * 10 / 12), s, count=1)
              open(p, "w").write(s)
          PY
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Pushes made with GITHUB_TOKEN do not re-trigger this workflow.
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards
          git diff --cached --quiet || git commit -m "Refresh contribution cards" && git push
