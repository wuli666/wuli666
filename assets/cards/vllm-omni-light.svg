<svg xmlns="http://www.w3.org/2000/svg" width="420" height="128" viewBox="0 0 420 128">
<style>
text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
.org{font-size:12px;fill:#6e7781} .name{font-size:20px;font-weight:700;fill:#1f2328}
.blurb{font-size:13px;fill:#424a53} .meta{font-size:12px;fill:#6e7781}
.chip{font-size:12px;font-weight:600;text-anchor:middle}
.card{animation:rise .6s ease-out both} @keyframes rise{from{opacity:0;transform:translateY(6px)}}
</style>
<g class="card">
<rect x="0.5" y="0.5" width="419" height="127" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<rect x="0.5" y="16" width="4" height="96" rx="2" fill="#7aa2f7"/>
<text x="24" y="30" class="org">vllm-project</text>
<text x="24" y="54" class="name">vllm-omni</text>
<text x="396" y="30" class="meta" text-anchor="end">★ 7k</text>
<text x="24" y="74" class="blurb">Omni-modality inference on vLLM</text>
<rect x="24" y="86" width="99" height="22" rx="11" fill="#7aa2f7" fill-opacity="0.16"/><text x="74" y="101" class="chip" fill="#7aa2f7">Step-Audio2</text><rect x="131.2" y="86" width="121" height="22" rx="11" fill="#7aa2f7" fill-opacity="0.16"/><text x="192" y="101" class="chip" fill="#7aa2f7">Triton kernels</text><rect x="260.0" y="86" width="106" height="22" rx="11" fill="#7aa2f7" fill-opacity="0.16"/><text x="313" y="101" class="chip" fill="#7aa2f7">Quantization</text>
</g>
</svg>
